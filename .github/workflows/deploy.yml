name: Auto Deploy Element Web to EdgeOne Pages

on:
  push:
    branches: [ main, master ]
  schedule:
    # 每天北京时间早上 8:00 (UTC 0:00) 自动执行检测
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许在面板上手动触发部署

env:
  # 替换为你实际绑定在 EdgeOne 上的 Element 域名，用于比对线上版本号
  YOUR_DOMAIN: "element.o3.hk"
  # 替换为你想要在 EdgeOne Pages 中部署的项目名称
  PROJECT_NAME: "element-web-staredge" 

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for new version
        id: version_check
        run: |
          LATEST_TAG=$(curl -s https://api.github.com/repos/element-hq/element-web/releases/latest | jq -r '.tag_name')
          echo "Official latest version is: $LATEST_TAG"
          
          # 尝试读取线上版本号
          CURRENT_TAG=$(curl -sL "https://${{ env.YOUR_DOMAIN }}/version.txt" || echo "none")
          echo "Currently deployed version is: $CURRENT_TAG"
          
          if [ "$LATEST_TAG" == "$CURRENT_TAG" ]; then
            echo "Version is up to date. Skipping deployment."
            echo "skip=true" >> $GITHUB_ENV
          else
            echo "New version detected! Proceeding with download and deploy."
            echo "skip=false" >> $GITHUB_ENV
            echo "LATEST_TAG=$LATEST_TAG" >> $GITHUB_ENV
          fi

      - name: Download and extract official release
        if: env.skip == 'false'
        run: |
          # 获取官方编译好的静态资源包的真实下载地址
          ASSET_URL=$(curl -s https://api.github.com/repos/element-hq/element-web/releases/tags/${{ env.LATEST_TAG }} | jq -r '.assets[] | select(.name | endswith(".tar.gz")) | .browser_download_url')
          echo "Downloading from: $ASSET_URL"
          
          curl -L -o element.tar.gz "$ASSET_URL"
          mkdir -p dist
          tar -xzf element.tar.gz -C dist --strip-components=1
          
          echo "${{ env.LATEST_TAG }}" > dist/version.txt

      - name: Inject custom config.json
        if: env.skip == 'false'
        run: |
          cp config.json dist/config.json
          echo "Custom config.json injected successfully."

      # 【修正点 1】：注入 Node.js 环境以支持 EdgeOne 的 CLI 工具
      - name: Setup Node.js
        if: env.skip == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '22' # 官方推荐的 Node 版本

      # 【修正点 2】：严格按照官方文档使用 npx 执行部署
      - name: Deploy to EdgeOne Pages via CLI
        if: env.skip == 'false'
        run: |
          echo "Deploying to EdgeOne Pages project: ${{ env.PROJECT_NAME }}"
          npx edgeone pages deploy ./dist -n ${{ env.PROJECT_NAME }} -t ${{ secrets.EDGEONE_API_TOKEN }}