name: Auto Deploy Element Web to EdgeOne Pages

on:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

env:
  YOUR_DOMAIN: "c.o3.hk"
  PROJECT_NAME: "element-web" 

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine if deployment is needed
        id: version_check
        run: |
          LATEST_TAG=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/element-hq/element-web/releases/latest | jq -r '.tag_name')
          echo "Official latest version is: $LATEST_TAG"
          
          CURRENT_TAG=$(curl -sL "https://${{ env.YOUR_DOMAIN }}/version.txt" || echo "none")
          echo "Currently deployed version is: $CURRENT_TAG"
          
          if [ "${{ github.event_name }}" == "push" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "Triggered by push or manual trigger. Force deploying to apply local changes."
            echo "skip=false" >> $GITHUB_ENV
            echo "LATEST_TAG=$LATEST_TAG" >> $GITHUB_ENV
          elif [ "$LATEST_TAG" == "$CURRENT_TAG" ]; then
            echo "Triggered by schedule. Version is up to date. Skipping deployment."
            echo "skip=true" >> $GITHUB_ENV
          else
            echo "Triggered by schedule. New version detected! Proceeding with deploy."
            echo "skip=false" >> $GITHUB_ENV
            echo "LATEST_TAG=$LATEST_TAG" >> $GITHUB_ENV
          fi

      - name: Download and extract official release
        if: env.skip == 'false'
        run: |
          ASSET_URL=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/element-hq/element-web/releases/tags/${{ env.LATEST_TAG }} | jq -r '.assets[] | select(.name | endswith(".tar.gz")) | .browser_download_url')
          echo "Downloading from: $ASSET_URL"
          
          curl -L -o element.tar.gz "$ASSET_URL"
          mkdir -p dist
          tar -xzf element.tar.gz -C dist --strip-components=1
          
          echo "${{ env.LATEST_TAG }}" > dist/version.txt

      - name: Inject custom config.json
        if: env.skip == 'false'
        run: |
          cp config.json dist/config.json
          echo "Custom config.json injected successfully."

      - name: Setup Node.js
        if: env.skip == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy to EdgeOne Pages via CLI
        if: env.skip == 'false'
        run: |
          echo "Deploying to EdgeOne Pages project: ${{ env.PROJECT_NAME }}"
          npx edgeone pages deploy ./dist -n ${{ env.PROJECT_NAME }} -t ${{ secrets.EDGEONE_API_TOKEN }}
